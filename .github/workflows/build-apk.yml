
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          set -eu
          mkdir -p app/src/main/java/com/dogsunny/androiddemo
          mkdir -p app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AndroidLiveDemo'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.9.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dogsunny.androidlivedemo'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.dogsunny.androidlivedemo'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Live Demo" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/dogsunny/androiddemo/MainActivity.java <<'EOF'
          package com.dogsunny.androidlivedemo;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override protected void onDestroy() {
                  webView.destroy();
                  super.onDestroy();
              }
          }
          EOF
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          else
            cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{background:#10151e;color:white;font:20px system-ui;display:grid;place-items:center;min-height:90dvh;text-align:center}</style></head><body><div><h1>Live Demo</h1><p>APK生成の準備は完了です。</p><p>次はAIが作った index.html を追加するだけ。</p></div></body></html>
          EOF
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-live-demo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
