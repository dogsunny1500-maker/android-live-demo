<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1122"><title>NEON BLOCKS | 落ちゲー</title>
<style>
:root{--board-w:min(62vw,245px,27.5dvh);--bg:#0b1020;--panel:#18243d;--edge:#354363;--ink:#f6f7ff;--mute:#9aa9c6;--lime:#71f4c7;--violet:#b795ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{background:radial-gradient(ellipse 95% 65% at 50% -15%,#39416e 0%,transparent 73%),var(--bg);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid white;outline-offset:2px}
[hidden]{display:none!important}
.app{width:min(100%,520px);margin:0 auto;padding:calc(13px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;letter-spacing:.07em;font-weight:950}
.logo-badge{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:linear-gradient(125deg,#7bf4d6,#9982fa);color:#091427;font-size:20px}
.accent{color:var(--lime)}
.topbtn{background:#283550;border:1px solid #3c4d71;border-radius:10px;font-size:12px;font-weight:700;padding:10px 11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{border:1px solid var(--edge);border-radius:13px;background:#1a2440;padding:9px 10px}
.stat small{display:block;color:var(--mute);font-size:10px;letter-spacing:.08em;font-weight:800}
.stat strong{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin-top:1px}
.game-row{display:flex;align-items:flex-start;justify-content:center;gap:10px}
.board-frame{position:relative;flex:0 0 auto;line-height:0;border:2px solid #6f73a8;border-radius:12px;padding:4px;background:#121b30;box-shadow:0 0 24px #8588fa24, inset 0 0 0 1px #28344e}
#board{display:block;width:var(--board-w);height:calc(var(--board-w)*2);border-radius:5px;background:#0b1529;touch-action:none}
.side{width:calc(100% - var(--board-w) - 24px);max-width:118px;min-width:75px;display:flex;flex-direction:column;gap:9px}
.sidebox{border:1px solid var(--edge);border-radius:13px;background:#192540;padding:9px 5px;text-align:center}
.sidebox small{display:block;color:var(--mute);letter-spacing:.08em;font-size:10px;font-weight:800;margin-bottom:6px}
#next{width:min(100%,84px);height:auto;aspect-ratio:1;margin:auto;display:block}
.sidebox p{margin:4px 0;font-size:11px;font-weight:700}
.sidebox .value{font-size:21px;color:var(--lime);font-weight:900}
.help{font-size:11px;line-height:1.5;color:#bac6db;margin:0}
.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:13px}
.control{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;background:#263651;border:1px solid #415575;border-radius:13px;font-size:25px;box-shadow:0 4px 0 #121c32;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.control span{font-size:10px;font-weight:700;color:#c8d4ea}
.control:active{background:#40537a;transform:translateY(2px);box-shadow:0 2px 0 #121c32}
.control.special{background:linear-gradient(145deg,#806ee8,#5346ac);border-color:#a394ee}
.tip{text-align:center;color:var(--mute);font-size:11px;margin:16px 0 0;line-height:1.5}
.overlay{position:absolute;inset:4px;z-index:4;display:flex;align-items:center;justify-content:center;background:#081021d9;border-radius:7px;padding:10px;line-height:1.5}
.dialog{width:100%;text-align:center;padding:11px 3px}
.dialog .symbol{font-size:37px;margin-bottom:6px;line-height:1.3}
.dialog h1{font-size:25px;margin:5px 0 9px;letter-spacing:.035em}
.dialog p{font-size:13px;color:#c4d1e6;margin:6px 0 16px;line-height:1.6}
.dialog .primary{display:block;width:100%;padding:12px 9px;background:linear-gradient(100deg,#9d90f9,#70e8c9);border-radius:12px;color:#13203a;font-weight:950;font-size:15px}
.dialog .secondary{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #53648a;background:#263653;border-radius:12px;font-size:13px}
@media(max-width:370px){.app{padding-left:8px;padding-right:8px}.game-row{gap:7px}.controls{gap:5px}.control{min-height:57px}}
</style></head>
<body><div class="app">
<header class="head"><div class="logo"><div class="logo-badge">▣</div><div>NEON <span class="accent">BLOCKS</span></div></div><div><button id="sound" class="topbtn" type="button" aria-label="効果音">♪ ON</button> <button id="pause" class="topbtn" type="button">一時停止</button></div></header>
<div class="stats"><div class="stat"><small>スコア</small><strong id="score">0</strong></div><div class="stat"><small>消した行</small><strong id="lines">0</strong></div><div class="stat"><small>レベル</small><strong id="level">1</strong></div></div>
<main class="game-row">
 <div class="board-frame"><canvas id="board" width="300" height="600" aria-label="落ちてくるブロックのゲーム画面"></canvas>
   <div class="overlay" id="overlay"><div class="dialog"><div class="symbol" id="dialogIcon">🧩</div><h1 id="dialogTitle">ブロック落ちゲー</h1><p id="dialogText">左右に動かして、ブロックを積もう。<br>横一列そろうと消えて得点！</p><button id="primary" class="primary" type="button">ゲーム開始 ▶</button><button id="secondary" class="secondary" type="button" hidden>最初から</button></div></div>
 </div>
 <aside class="side">
   <div class="sidebox"><small>つぎ</small><canvas id="next" width="100" height="100" aria-label="次のブロック"></canvas></div>
   <div class="sidebox"><small>ベスト</small><div id="best" class="value">0</div></div>
   <div class="sidebox"><small>操作</small><p>↔ 移動</p><p>↻ 回転</p><p>↓ 下げる</p><p>⤓ 一気に落とす</p></div>
 </aside>
</main>
<nav class="controls" aria-label="操作ボタン"><button type="button" class="control" id="left" aria-label="左へ移動">◀<span>左</span></button><button type="button" class="control" id="rotate" aria-label="回転">⟳<span>回転</span></button><button type="button" class="control" id="down" aria-label="一段下げる">▼<span>下</span></button><button type="button" class="control" id="right" aria-label="右へ移動">▶<span>右</span></button><button type="button" class="control special" id="drop" aria-label="一気に落とす">⤓<span>落とす</span></button></nav>
<p class="tip">盤面をスワイプしても操作できます：左右移動・上に回転・下に落下。<br>オフライン対応 / キーボード操作も可能</p>
</div>
<script>
(()=>{
"use strict";
const COLS=10,ROWS=20,BLOCK=30;
const SHAPES=[
 {name:"I",color:"#56e7e1",cells:[[0,1],[1,1],[2,1],[3,1]]},
 {name:"O",color:"#ffe37d",cells:[[1,0],[2,0],[1,1],[2,1]]},
 {name:"T",color:"#bc98ff",cells:[[1,0],[0,1],[1,1],[2,1]]},
 {name:"S",color:"#77eaa7",cells:[[1,0],[2,0],[0,1],[1,1]]},
 {name:"Z",color:"#ff758c",cells:[[0,0],[1,0],[1,1],[2,1]]},
 {name:"J",color:"#77aaff",cells:[[0,0],[0,1],[1,1],[2,1]]},
 {name:"L",color:"#ffad6d",cells:[[2,0],[0,1],[1,1],[2,1]]}
];
const $=id=>document.getElementById(id),canvas=$("board"),ctx=canvas.getContext("2d"),nctx=$("next").getContext("2d");
let grid=[],piece=null,nextIndex=null,bag=[],score=0,lines=0,level=1,best=0;
let mode="ready",mute=false,last=0,elapsed=0,audio=null;
try{best=Number(localStorage.getItem("neon-blocks-best"))||0}catch(e){}
$("best").textContent=best.toLocaleString("ja-JP");
function randomBag(){const ids=SHAPES.map((_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return ids;}
function take(){if(!bag.length)bag=randomBag();return bag.pop()}
function blank(){return Array.from({length:ROWS},()=>Array(COLS).fill(-1))}
function make(id){return {id,x:3,y:-1,cells:SHAPES[id].cells.map(([x,y])=>[x,y])}}
function collision(p,dx=0,dy=0,cells=p.cells){
 return cells.some(([x,y])=>{
  const cx=p.x+x+dx,cy=p.y+y+dy;
  return cx<0||cx>=COLS||cy>=ROWS||(cy>=0&&grid[cy][cx]!==-1);
 });
}
function spawn(){piece=make(nextIndex);nextIndex=take();if(collision(piece)){endGame();return;}drawNext();}
function updateHUD(){
 $("score").textContent=score.toLocaleString("ja-JP");
 $("lines").textContent=String(lines);$("level").textContent=String(level);
 if(score>best){best=score;$("best").textContent=best.toLocaleString("ja-JP");try{localStorage.setItem("neon-blocks-best",String(best))}catch(e){}}
}
function beep(happy=true){
 if(mute)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audio=audio||new AC();if(audio.state==="suspended")audio.resume();
  let oscillator=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;
  oscillator.type=happy?"sine":"triangle";oscillator.frequency.setValueAtTime(happy?720:180,t);
  if(happy)oscillator.frequency.exponentialRampToValueAtTime(1050,t+.12);
  gain.gain.setValueAtTime(.08,t);gain.gain.exponentialRampToValueAtTime(.001,t+.17);
  oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(t);oscillator.stop(t+.18);
 }catch(e){}
}
function lock(){
 if(!piece)return;
 const id=piece.id;let above=false;
 for(const [x,y] of piece.cells){
  const cx=piece.x+x,cy=piece.y+y;
  if(cy<0)above=true;else if(cy<ROWS&&cx>=0&&cx<COLS)grid[cy][cx]=id;
 }
 piece=null;
 if(above){endGame();return;}
 let cleared=0;
 for(let y=ROWS-1;y>=0;y--){
  if(grid[y].every(v=>v!==-1)){grid.splice(y,1);grid.unshift(Array(COLS).fill(-1));cleared++;y++;}
 }
 if(cleared){score+=([0,100,300,500,800][cleared]||800)*level;lines+=cleared;level=1+Math.floor(lines/10);beep(true);}
 updateHUD();spawn();
}
function move(dx){if(mode!=="playing"||!piece)return;if(!collision(piece,dx,0)){piece.x+=dx;draw();}}
function fall(soft=false){
 if(mode!=="playing"||!piece)return;
 if(!collision(piece,0,1)){piece.y++;if(soft){score++;updateHUD();}}
 else lock();
 draw();
}
function rotate(){
 if(mode!=="playing"||!piece||piece.id===1)return;
 const rotated=piece.cells.map(([x,y])=>[3-y,x]);
 for(const dx of [0,-1,1,-2,2]){
  if(!collision(piece,dx,0,rotated)){piece.cells=rotated;piece.x+=dx;draw();return;}
 }
}
function hardDrop(){
 if(mode!=="playing"||!piece)return;
 let steps=0;while(!collision(piece,0,1)){piece.y++;steps++;}
 score+=steps*2;beep(false);lock();updateHUD();draw();
}
function tile(c,x,y,color,unit=BLOCK,ghost=false){
 const px=x*unit,py=y*unit;
 c.globalAlpha=ghost?.25:1;
 c.fillStyle=color;c.fillRect(px+1,py+1,unit-2,unit-2);
 if(!ghost){c.fillStyle="#ffffff4d";c.fillRect(px+3,py+3,unit-6,3);c.fillStyle="#00000030";c.fillRect(px+unit-5,py+4,3,unit-8);}
 c.globalAlpha=1;
}
function draw(){
 ctx.clearRect(0,0,300,600);
 ctx.fillStyle="#0d172b";ctx.fillRect(0,0,300,600);
 ctx.strokeStyle="#20304b";ctx.lineWidth=1;
 ctx.beginPath();
 for(let x=1;x<COLS;x++){ctx.moveTo(x*BLOCK+.5,0);ctx.lineTo(x*BLOCK+.5,600);}
 for(let y=1;y<ROWS;y++){ctx.moveTo(0,y*BLOCK+.5);ctx.lineTo(300,y*BLOCK+.5);}
 ctx.stroke();
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]>=0)tile(ctx,x,y,SHAPES[grid[y][x]].color);
 if(piece){
  const ghost={...piece};
  while(!collision(ghost,0,1))ghost.y++;
  for(const [x,y] of ghost.cells)if(ghost.y+y>=0)tile(ctx,ghost.x+x,ghost.y+y,SHAPES[ghost.id].color,BLOCK,true);
  for(const [x,y] of piece.cells)if(piece.y+y>=0)tile(ctx,piece.x+x,piece.y+y,SHAPES[piece.id].color);
 }
}
function drawNext(){
 nctx.clearRect(0,0,100,100);
 nctx.fillStyle="#101b30";nctx.fillRect(0,0,100,100);
 if(nextIndex===null)return;
 const s=SHAPES[nextIndex],xs=s.cells.map(p=>p[0]),ys=s.cells.map(p=>p[1]);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),u=21;
 const ox=Math.floor((100-(maxX-minX+1)*u)/2),oy=Math.floor((100-(maxY-minY+1)*u)/2);
 for(const [x,y] of s.cells){
  const px=ox+(x-minX)*u,py=oy+(y-minY)*u;
  nctx.fillStyle=s.color;nctx.fillRect(px+1,py+1,u-2,u-2);
  nctx.fillStyle="#ffffff44";nctx.fillRect(px+3,py+3,u-6,2);
 }
}
function dialog(icon,title,message,button,secondary=false){
 $("dialogIcon").textContent=icon;$("dialogTitle").textContent=title;$("dialogText").textContent=message;
 $("primary").textContent=button;$("secondary").hidden=!secondary;$("overlay").hidden=false;
}
function start(){
 grid=blank();score=0;lines=0;level=1;bag=[];nextIndex=take();piece=null;
 mode="playing";elapsed=0;last=0;$("overlay").hidden=true;$("pause").textContent="一時停止";
 updateHUD();spawn();draw();
}
function endGame(){
 mode="over";beep(false);updateHUD();draw();
 dialog("🏁","ゲーム終了","スコア "+score.toLocaleString("ja-JP")+"点！\n横一列をそろえて、自己ベストを更新しよう。","もう一度遊ぶ");
}
function pause(){
 if(mode==="playing"){mode="paused";dialog("⏸","一時停止","続きから再開できます。","再開する",true);$("pause").textContent="再開";}
 else if(mode==="paused"){mode="playing";last=0;elapsed=0;$("overlay").hidden=true;$("pause").textContent="一時停止";}
}
function frame(t){
 if(mode==="playing"){
  if(!last)last=t;
  elapsed+=Math.min(t-last,100);last=t;
  const delay=Math.max(90,820*Math.pow(.82,level-1));
  if(elapsed>=delay){elapsed=0;fall();}
 }else last=t;
 requestAnimationFrame(frame);
}
function press(id,action){$(id).addEventListener("click",e=>{e.preventDefault();action();});}
press("left",()=>move(-1));press("right",()=>move(1));press("rotate",rotate);
press("down",()=>fall(true));press("drop",hardDrop);
press("pause",pause);
press("primary",()=>{if(mode==="paused")pause();else start();});
press("secondary",start);
press("sound",()=>{mute=!mute;$("sound").textContent=mute?"♪ OFF":"♪ ON";$("sound").setAttribute("aria-pressed",String(!mute));});
document.addEventListener("keydown",e=>{
 const actions={ArrowLeft:()=>move(-1),ArrowRight:()=>move(1),ArrowUp:rotate,ArrowDown:()=>fall(true),Space:hardDrop,KeyP:pause};
 if(actions[e.code]){e.preventDefault();if(!e.repeat||["ArrowLeft","ArrowRight","ArrowDown"].includes(e.code))actions[e.code]();}
});
let point=null;
canvas.addEventListener("pointerdown",e=>{point={x:e.clientX,y:e.clientY};},{passive:true});
canvas.addEventListener("pointerup",e=>{
 if(!point||mode!=="playing")return;
 const dx=e.clientX-point.x,dy=e.clientY-point.y;point=null;
 if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25){
  let steps=Math.min(4,Math.max(1,Math.round(Math.abs(dx)/35)));
  while(steps--)move(dx>0?1:-1);
 }else if(dy>50)hardDrop();else if(dy< -28||Math.abs(dx)<18&&Math.abs(dy)<18)rotate();
},{passive:true});
canvas.addEventListener("pointercancel",()=>{point=null;});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="playing")pause();});
grid=blank();draw();drawNext();requestAnimationFrame(frame);
})();
</script></body></html>
